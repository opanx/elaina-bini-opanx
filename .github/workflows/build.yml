name: Elaina Bot CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install system dependencies for canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            librsvg2-dev \
            pixman \
            libpixman-1-dev \
            pkg-config \
            build-essential \
            python3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify project structure
        run: |
          echo "✅ Checking project structure..."
          test -f settings.js || exit 1
          test -f index.js || exit 1
          test -f Elaina.js || exit 1
          test -f package.json || exit 1
          test -f lib/allmenu.js || exit 1
          test -f lib/function.js || exit 1
          test -f lib/games.js || exit 1
          echo "✅ All core files present!"

      - name: Check syntax
        run: |
          node --check settings.js
          node --check index.js
          node --check lib/allmenu.js
          node --check lib/function.js
          node --check lib/games.js
          node --check lib/converter.js
          node --check lib/db.js

      - name: Build success
        run: echo "✅ Build successful! Bot is ready to deploy."
